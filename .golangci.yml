version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - unconvert
    - revive

  settings:
    revive:
      rules:
        # ctx is carried for interface conformance even if a particular
        # implementation doesn't use it; don't force renaming to _.
        - name: unused-parameter
          disabled: true

  exclusions:
    rules:
      - path: _test\.go$
        linters:
          - errcheck

formatters:
  enable:
    - gofmt
    - goimports
